version: '3'

services:
  wekan-db:
    image: mongo:4.4.7
    container_name: wekan-db
    restart: always
    command: mongod --oplogSize 128
    volumes:
      - wekan-db-data:/data/db

  wekan:
    image: quay.io/wekan/wekan:latest
    container_name: wekan-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - MONGO_URL=mongodb://wekan-db:27017/wekan
      - ROOT_URL=http://localhost:8080
      - WITH_API=true
    depends_on:
      - wekan-db

volumes:
  wekan-db-data: